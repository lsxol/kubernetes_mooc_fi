apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-backend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend-app
  template:
    metadata:
      labels:
        app: todo-backend-app
    spec:
      containers:
        - name: todo-backend-app
          image: lsxol/todo-backend-app:latest
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            httpGet:
              path: /healthz/ready
              port: 8080
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            httpGet:
              path: /healthz/live
              port: 8080
          env:
            - name: POSTGRES_HOST
              value: postgresql-todo-svc
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-todo-secrets
                  key: POSTGRES_PASSWORD_TODO
            - name: NATS_URL
              value: nats://my-nats.nats.svc.cluster.local:4222