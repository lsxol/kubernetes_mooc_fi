apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-backend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend-app
  template:
    metadata:
      labels:
        app: todo-backend-app
    spec:
      containers:
        - name: todo-backend-app
          image: lsxol/todo-backend-app:latest
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: POSTGRES_HOST
              value: postgresql-todo-svc
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-todo-secrets
                  key: POSTGRES_PASSWORD_TODO