apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: project-staging
resources:
- ../../base
  # staging broadcaster only logs the messages, nothing is sent to the webhook
  # staging database is not backed up
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: FORWARD_ENABLED
        value: "false"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: NATS_SUBJECT
        value: todos-staging
  target:
    kind: Deployment
    name: broadcaster
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: NATS_SUBJECT
        value: todos-staging
  target:
    kind: Deployment
    name: todo-backend-app
- patch: |-
    $patch: delete
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: todo-backup-job
      namespace: project
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: todo-backup-sa
      namespace: project
images:
- name: lsxol/broadcaster
  newName: lsxol/broadcaster
  newTag: 494a9d93eaafa5e66aef53ca81bc320f8896b23b
- name: lsxol/todo-app
  newName: lsxol/todo-app
  newTag: 494a9d93eaafa5e66aef53ca81bc320f8896b23b
- name: lsxol/todo-backend-app
  newName: lsxol/todo-backend-app
  newTag: 494a9d93eaafa5e66aef53ca81bc320f8896b23b
