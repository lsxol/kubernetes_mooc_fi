name: logoutput

on:
  push:
    branches:
      - master
    paths:
      - 'log_output/**'
      - 'ping-pong/**'
      - '.github/workflows/logoutput.yml'

permissions:
  contents: write

jobs:
  build-publish:
    name: Build, publish and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish reader
        run: |
          docker build -t lsxol/log-reader:${GITHUB_SHA} ./log_output/reader
          docker push lsxol/log-reader:${GITHUB_SHA}

      - name: Build and publish writer
        run: |
          docker build -t lsxol/log-output:${GITHUB_SHA} ./log_output/writer
          docker push lsxol/log-output:${GITHUB_SHA}

      - name: Install java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build ping-pong (Quarkus)
        working-directory: ping-pong
        run: ./gradlew build -x test

      - name: Build and publish ping-pong
        run: |
          docker build -f ./ping-pong/src/main/docker/Dockerfile.jvm -t lsxol/ping-pong:${GITHUB_SHA} ./ping-pong
          docker push lsxol/ping-pong:${GITHUB_SHA}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tags
        working-directory: log_output
        run: |
          kustomize edit set image lsxol/log-reader=lsxol/log-reader:${GITHUB_SHA}
          kustomize edit set image lsxol/log-output=lsxol/log-output:${GITHUB_SHA}
          kustomize edit set image lsxol/ping-pong=lsxol/ping-pong:${GITHUB_SHA}

      - name: Commit updated kustomization.yaml
        uses: EndBug/add-and-commit@v10
        with:
          add: 'log_output/kustomization.yaml'
          message: "New log_output version released ${{ github.sha }}"
