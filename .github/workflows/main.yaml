name: Release application

on:
  push:
    branches:
      - master
    paths:
      - 'todo-app/**'
      - 'todo-backend-app/**'
      - 'broadcaster/**'
      - '.github/workflows/main.yaml'

permissions:
  contents: write

jobs:
  build-publish:
    name: Build, publish and release
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build frontend
        working-directory: todo-app/todo-app
        run: ./gradlew build -x test

      - name: Build backend
        working-directory: todo-backend-app
        run: ./gradlew build -x test

      - name: Build broadcaster
        working-directory: broadcaster
        run: ./gradlew build -x test

      - name: Build and publish frontend image
        run: |
          docker build -f todo-app/todo-app/src/main/docker/Dockerfile.jvm -t lsxol/todo-app:${GITHUB_SHA} todo-app/todo-app
          docker push lsxol/todo-app:${GITHUB_SHA}

      - name: Build and publish backend image
        run: |
          docker build -f todo-backend-app/src/main/docker/Dockerfile.jvm -t lsxol/todo-backend-app:${GITHUB_SHA} todo-backend-app
          docker push lsxol/todo-backend-app:${GITHUB_SHA}

      - name: Build and publish broadcaster image
        run: |
          docker build -f broadcaster/src/main/docker/Dockerfile.jvm -t lsxol/broadcaster:${GITHUB_SHA} broadcaster
          docker push lsxol/broadcaster:${GITHUB_SHA}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tags
        run: |
          kustomize edit set image lsxol/todo-app=lsxol/todo-app:${GITHUB_SHA}
          kustomize edit set image lsxol/todo-backend-app=lsxol/todo-backend-app:${GITHUB_SHA}
          kustomize edit set image lsxol/broadcaster=lsxol/broadcaster:${GITHUB_SHA}

      - name: Commit updated kustomization.yaml
        uses: EndBug/add-and-commit@v10
        with:
          add: 'kustomization.yaml'
          message: "New project version released ${{ github.sha }}"
