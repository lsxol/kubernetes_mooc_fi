apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: my-pvc
      containers:
        - name: ping-pong
          image: lsxol/ping-pong:latest
          volumeMounts:
            - name: shared-volume
              mountPath: /usr/src/app/files