apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cpu-usage
  namespace: exercises
spec:
  metrics:
    - name: cpu-usage
      interval: 1m
      count: 5
      successCondition: result < 0.3
      provider:
        prometheus:
          address: http://prom-prometheus-server.monitoring.svc.cluster.local:80
          query: |
            scalar(sum(rate(container_cpu_usage_seconds_total{namespace="exercises", container!=""}[2m])))
